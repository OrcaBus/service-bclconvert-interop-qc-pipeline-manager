allowBuilds:
  '@parcel/watcher': true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - aws-cdk-lib@2.256.1
  - aws-cdk@2.1124.1
  - js-yaml@3.15.0
  - '@babel/core@7.29.1'
  - brace-expansion@1.1.16 || 1.1.17 || 1.1.18
  - '@orcabus/platform-cdk-constructs@1.9.3'
auditConfig:
  ignoreGhsas:
    # sprintf-js <=1.1.3 DoS via unbounded precision specifiers.
    # Patched in 1.1.4 (unreleased). Remove this exception when 1.1.4 ships and
    # add `sprintf-js@<=1.1.3: ^1.1.4` back to overrides above.
    - GHSA-hp3w-g68c-fv3c
    # Deepmerge
    - GHSA-gcqx-w48m-w2h4
overrides:
  glob@>=9.0.0 <=14.0.1: ^14.0.2
  minimatch@<11.0.1: ^11.0.1
