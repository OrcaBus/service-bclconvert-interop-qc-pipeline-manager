allowBuilds:
  '@parcel/watcher': true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - aws-cdk-lib@2.256.1
  - aws-cdk@2.1124.1
  - js-yaml@3.15.0
  - '@babel/core@7.29.1'
  - brace-expansion@1.1.16 || 1.1.17 || 1.1.18
  - '@orcabus/platform-cdk-constructs@1.9.3'
overrides:
  baseline-browser-mapping@>=2.0.0 <2.11.0: ^2.11.0
  brace-expansion@>=2.0.0 <2.1.5: ^2.1.5
  brace-expansion@>=2.0.0 <2.1.6: ^2.1.6
  brace-expansion@>=2.0.0 <2.1.7: ^2.1.7
  brace-expansion@>=4.0.0 <5.0.10: ^5.0.10
  brace-expansion@>=4.0.0 <5.0.11: ^5.0.11
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
  browserslist@<=4.28.6: ^4.28.7
  handlebars@>=3.0.0 <=4.7.9: ^4.7.10
  handlebars@>=4.0.0 <=4.7.9: ^4.7.10
  js-yaml@>=3.0.0 <3.15.2: ^3.15.2

auditConfig:
  ignoreGhsas:
    # sprintf-js <=1.1.3 DoS via unbounded precision specifiers.
    # Patched in 1.1.4 (unreleased). Remove this exception when 1.1.4 ships and
    # add `sprintf-js@<=1.1.3: ^1.1.4` back to overrides above.
    - GHSA-hp3w-g68c-fv3c
