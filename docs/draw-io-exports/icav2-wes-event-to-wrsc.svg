<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="750px" height="560px" viewBox="-0.5 -0.5 750 560">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555555"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888888"/>
    </marker>
  </defs>
  <g>
    <!-- Title -->
    <text x="375" y="20" text-anchor="middle" font-family="Helvetica" font-size="16" font-weight="bold" fill="#333333">ICAv2 WES Event → WRSC Event</text>

    <!-- Start -->
    <ellipse cx="175" cy="55" rx="30" ry="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="175" y="60" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="bold" fill="#1a1a1a">Start</text>

    <!-- Arrow: Start → Convert -->
    <line x1="175" y1="73" x2="175" y2="100" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Step: Convert ICAv2 WES event to WRSC Event -->
    <rect x="25" y="100" width="300" height="50" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
    <text x="175" y="122" text-anchor="middle" font-family="Helvetica" font-size="11" font-weight="bold" fill="#1a1a1a">Convert ICAv2 WES event</text>
    <text x="175" y="139" text-anchor="middle" font-family="Helvetica" font-size="11" font-weight="bold" fill="#1a1a1a">to WRSC Event</text>

    <!-- Arrow: Convert → Workflow failed? -->
    <line x1="175" y1="150" x2="175" y2="180" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Decision: Workflow failed? -->
    <polygon points="175,180 295,215 175,250 55,215" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
    <text x="175" y="219" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="bold" fill="#1a1a1a">Workflow failed?</text>

    <!-- Arrow: Yes → Add comment for WES failure -->
    <line x1="295" y1="215" x2="400" y2="215" stroke="#888888" stroke-width="2" stroke-dasharray="8 4" marker-end="url(#arrow-gray)"/>
    <text x="345" y="206" text-anchor="middle" font-family="Helvetica" font-size="10" font-style="italic" fill="#888888">Yes</text>

    <!-- Step: Add comment for WES failure -->
    <rect x="400" y="190" width="280" height="50" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
    <text x="540" y="220" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="bold" fill="#1a1a1a">Add comment for WES failure</text>

    <!-- Arrow: Add comment → Push WRSC Event -->
    <polyline points="540,240 540,310 325,310" fill="none" stroke="#888888" stroke-width="2" stroke-dasharray="8 4" marker-end="url(#arrow-gray)"/>

    <!-- Arrow: No → Push WRSC Event -->
    <line x1="175" y1="250" x2="175" y2="285" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="195" y="270" text-anchor="start" font-family="Helvetica" font-size="10" font-style="italic" fill="#888888">No</text>

    <!-- Step: Push WRSC Event -->
    <rect x="25" y="285" width="300" height="50" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
    <text x="175" y="315" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="bold" fill="#1a1a1a">Push WRSC Event</text>

    <!-- Arrow: Push → Success -->
    <line x1="175" y1="335" x2="175" y2="370" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Terminal: Success -->
    <ellipse cx="175" cy="390" rx="50" ry="18" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
    <text x="175" y="394" text-anchor="middle" font-family="Helvetica" font-size="11" font-weight="bold" fill="#1a1a1a">Success</text>
  </g>
</svg>
