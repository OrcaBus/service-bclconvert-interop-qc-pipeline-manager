<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="700px" height="700px" viewBox="-0.5 -0.5 700 700">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555555"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888888"/>
    </marker>
  </defs>
  <g>
    <!-- Title -->
    <text x="350" y="20" text-anchor="middle" font-family="Helvetica" font-size="16" font-weight="bold" fill="#333333">Validate Draft Data &amp; Put Ready Event</text>

    <!-- Start -->
    <ellipse cx="175" cy="55" rx="30" ry="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="175" y="60" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="bold" fill="#1a1a1a">Start</text>

    <!-- Arrow: Start → Validate draft schema -->
    <line x1="175" y1="73" x2="175" y2="100" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Step: Validate draft schema -->
    <rect x="25" y="100" width="300" height="50" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
    <text x="175" y="130" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="bold" fill="#1a1a1a">Validate draft schema</text>

    <!-- Arrow: Validate → Draft complete? -->
    <line x1="175" y1="150" x2="175" y2="180" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Decision: Draft complete? -->
    <polygon points="175,180 295,215 175,250 55,215" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
    <text x="175" y="219" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="bold" fill="#1a1a1a">Draft complete?</text>

    <!-- Arrow: No → Pass (end) -->
    <line x1="295" y1="215" x2="400" y2="215" stroke="#888888" stroke-width="2" stroke-dasharray="8 4" marker-end="url(#arrow-gray)"/>
    <text x="345" y="206" text-anchor="middle" font-family="Helvetica" font-size="10" font-style="italic" fill="#888888">No</text>
    <ellipse cx="470" cy="215" rx="50" ry="18" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
    <text x="470" y="219" text-anchor="middle" font-family="Helvetica" font-size="11" font-weight="bold" fill="#1a1a1a">Pass (end)</text>

    <!-- Arrow: Yes → Post-schema validation -->
    <line x1="175" y1="250" x2="175" y2="285" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="195" y="270" text-anchor="start" font-family="Helvetica" font-size="10" font-style="italic" fill="#888888">Yes</text>

    <!-- Step: Post-schema validation -->
    <rect x="25" y="285" width="300" height="50" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
    <text x="175" y="315" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="bold" fill="#1a1a1a">Post-schema validation</text>

    <!-- Arrow: Post-schema → Inputs valid? -->
    <line x1="175" y1="335" x2="175" y2="365" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Decision: Inputs valid? -->
    <polygon points="175,365 295,400 175,435 55,400" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
    <text x="175" y="404" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="bold" fill="#1a1a1a">Inputs valid?</text>

    <!-- Arrow: No → Pass (end) -->
    <line x1="295" y1="400" x2="400" y2="400" stroke="#888888" stroke-width="2" stroke-dasharray="8 4" marker-end="url(#arrow-gray)"/>
    <text x="345" y="391" text-anchor="middle" font-family="Helvetica" font-size="10" font-style="italic" fill="#888888">No</text>
    <ellipse cx="470" cy="400" rx="50" ry="18" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
    <text x="470" y="404" text-anchor="middle" font-family="Helvetica" font-size="11" font-weight="bold" fill="#1a1a1a">Pass (end)</text>

    <!-- Arrow: Yes → Emit READY event -->
    <line x1="175" y1="435" x2="175" y2="470" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="195" y="455" text-anchor="start" font-family="Helvetica" font-size="10" font-style="italic" fill="#888888">Yes</text>

    <!-- Step: Emit READY event -->
    <rect x="25" y="470" width="300" height="50" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
    <text x="175" y="500" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="bold" fill="#1a1a1a">Emit READY event</text>

    <!-- Arrow: Emit → Success -->
    <line x1="175" y1="520" x2="175" y2="555" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Terminal: Success -->
    <ellipse cx="175" cy="575" rx="50" ry="18" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
    <text x="175" y="579" text-anchor="middle" font-family="Helvetica" font-size="11" font-weight="bold" fill="#1a1a1a">Success</text>
  </g>
</svg>
